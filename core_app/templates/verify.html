<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Code — {{ SYSTEM_OFFICE_CODE }} Document System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-navy:   #0f2744;
      --brand-blue:   #1a5fa8;
      --brand-accent: #2e8de4;
      --brand-light:  #e8f1fb;
      --brand-muted:  #6b7a8f;
      --brand-border: #d0dae8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background-color: #0f2744;
      background-image: linear-gradient(rgba(15, 39, 68, 0.8), rgba(15, 39, 68, 0.8)), url("{{ url_for('static', filename='images/essic_bg.jpg') }}");
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(15,39,68,.35);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .card-header {
      background: var(--brand-navy);
      padding: 32px 36px 28px;
      text-align: center;
    }
    .badge-brand {
      display: inline-block;
      background: var(--brand-accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .card-header h1 { color: #fff; font-size: 22px; font-weight: 700; }
    .card-header p { color: rgba(255,255,255,.5); font-size: 13px; margin-top: 6px; }
    .card-body { padding: 32px 36px 36px; }
    .email-badge {
      background: var(--brand-light);
      color: var(--brand-blue);
      border: 1px solid rgba(26,95,168,.2);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-navy);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 7px;
    }
    .code-input {
      width: 100%;
      padding: 16px;
      border: 2px solid var(--brand-border);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: var(--brand-navy);
      text-align: center;
      letter-spacing: 10px;
      background: #fafcff;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .code-input:focus {
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 3px rgba(46,141,228,.12);
      background: #fff;
    }
    .hint { font-size: 12px; color: var(--brand-muted); text-align: center; margin-top: 8px; }
    .btn-verify {
      width: 100%;
      padding: 13px;
      background: var(--brand-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, box-shadow .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-verify:hover {
      background: var(--brand-accent);
      box-shadow: 0 6px 20px rgba(46,141,228,.35);
    }
    .btn-back {
      width: 100%;
      padding: 11px;
      background: transparent;
      color: var(--brand-muted);
      border: 1.5px solid var(--brand-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all .2s;
    }
    .btn-back:hover { border-color: var(--brand-accent); color: var(--brand-blue); }
    .alert-box {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .alert-danger  { background: #fff0f0; color: #c0392b; border: 1px solid #e57373; }
    .alert-warning { background: #fff8e6; color: #9a6c00; border: 1px solid #f5cc70; }
    .alert-info    { background: var(--brand-light); color: var(--brand-blue); border: 1px solid var(--brand-border); }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="badge-brand">{{ SYSTEM_OFFICE_CODE }}</div>
      <h1>Two-Factor Auth</h1>
      <p>Enter the 6-digit code from your Authenticator app</p>
    </div>
    <div class="card-body">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert-box alert-{{ category }}">
              <i class="bi bi-{% if category == 'danger' %}x-circle-fill{% elif category == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %}"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="email-badge">
        <i class="bi bi-person-badge" style="margin-right:6px;"></i>{{ email }}
      </div>

      <form method="POST" action="{{ url_for('verify') }}">
        <div class="form-group">
          <label for="code">Authenticator Code</label>
          <input type="text" id="code" name="code" class="code-input"
                 placeholder="000000" maxlength="6" inputmode="numeric"
                 autocomplete="one-time-code" autofocus required />
        </div>
        <button type="submit" class="btn-verify">
          <i class="bi bi-shield-check"></i> Verify & Sign In
        </button>
      </form>

      <a href="{{ url_for('login') }}" class="btn-back">
        <i class="bi bi-arrow-left"></i> Cancel
      </a>
    </div>
  </div>

  <script>
    // Auto-submit when 6 digits entered
    document.getElementById('code').addEventListener('input', function() {
      if (this.value.length === 6) {
        this.closest('form').submit();
      }
    });
  </script>
</body>
</html>
