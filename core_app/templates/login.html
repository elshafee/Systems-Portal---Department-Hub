<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — {{ SYSTEM_OFFICE_CODE }} Document System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-navy:   #0f2744;
      --brand-blue:   #1a5fa8;
      --brand-accent: #2e8de4;
      --brand-light:  #e8f1fb;
      --brand-muted:  #6b7a8f;
      --brand-border: #d0dae8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background-color: #0f2744;
      background-image: linear-gradient(rgba(15, 39, 68, 0.8), rgba(15, 39, 68, 0.8)), url("{{ url_for('static', filename='images/essic_bg.jpg') }}");
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(15,39,68,.35);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .login-header {
      background: var(--brand-navy);
      padding: 32px 36px 28px; text-align: center;
    }
    .badge-brand {
      display: inline-block; background: var(--brand-accent); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
    }
    .login-header h1 { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.3; }
    .login-header p { color: rgba(255,255,255,.5); font-size: 13px; margin-top: 6px; }
    .login-body { padding: 32px 36px 36px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600; color: var(--brand-navy);
      text-transform: uppercase; letter-spacing: .8px; margin-bottom: 7px;
    }
    .form-group input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--brand-border);
      border-radius: 8px; font-family: inherit; font-size: 14px; color: var(--brand-navy);
      background: #fafcff; transition: border-color .2s, box-shadow .2s; outline: none;
    }
    .form-group input:focus {
      border-color: var(--brand-accent); box-shadow: 0 0 0 3px rgba(46,141,228,.12); background: #fff;
    }
    .input-hint { font-size: 11px; color: var(--brand-muted); margin-top: 5px; }
    .btn-login {
      width: 100%; padding: 13px; background: var(--brand-blue); color: #fff; border: none;
      border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .2s, box-shadow .2s; display: flex; align-items: center;
      justify-content: center; gap: 8px; margin-top: 8px;
    }
    .btn-login:hover { background: var(--brand-accent); box-shadow: 0 6px 20px rgba(46,141,228,.35); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .alert-box {
      border-radius: 8px; padding: 12px 16px; font-size: 13px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
    }
    .alert-danger  { background: #fff0f0; color: #c0392b; border: 1px solid #e57373; }
    .alert-warning { background: #fff8e6; color: #9a6c00; border: 1px solid #f5cc70; }
    .alert-info    { background: var(--brand-light); color: var(--brand-blue); border: 1px solid var(--brand-border); }
    .alert-success { background: #e8f8f1; color: #1a7a4a; border: 1px solid #a8dfc0; }
    .login-footer {
      text-align: center; font-size: 11px; color: var(--brand-muted);
      margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--brand-border);
    }
    /* Sent state */
    .sent-state { display: none; text-align: center; padding: 8px 0 16px; }
    .sent-icon {
      width: 64px; height: 64px; background: #e8f8f1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px; font-size: 28px; color: #1a7a4a;
    }
    .sent-state h3 { font-size: 18px; font-weight: 700; color: var(--brand-navy); margin-bottom: 8px; }
    .sent-state p { font-size: 13px; color: var(--brand-muted); }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="badge-brand">{{ SYSTEM_OFFICE_CODE }}</div>
    <h1>Document Numbering<br>System</h1>
    <p>Electronic Services & Science Innovation Center</p>
  </div>
  <div class="login-body">
    <div id="alert-container"></div>

    <!-- Step 1: Email form -->
    <div id="form-state">
      <form id="login-form" method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
          <label for="email">University Email</label>
          <input type="email" id="email" name="email" placeholder="yourname@horus.edu.eg" required autocomplete="email" />
        </div>
        <button type="submit" class="btn-login" id="submit-btn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>
    </div>

    <div class="login-footer">{{ SYSTEM_OFFICE_CODE }} Document Numbering System &copy; {{ SYSTEM_OFFICE_CODE }}</div>
  </div>
</div>
</body>
</html>
