<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied — Gateway</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-navy:   #0f2744;
      --brand-muted:  #6b7a8f;
      --brand-border: #d0dae8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      background-color: #0f2744;
      background-image: linear-gradient(rgba(15, 39, 68, 0.8), rgba(15, 39, 68, 0.8)), url("{{ url_for('static', filename='images/essic_bg.jpg') }}");
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(15,39,68,.35);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .login-header {
      background: #c0392b;
      padding: 32px 36px 28px; text-align: center;
    }
    .badge-brand {
      display: inline-block; background: rgba(255,255,255,0.2); color: #fff;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      padding: 4px 12px; border-radius: 20px; margin-bottom: 12px;
    }
    .login-header h1 { color: #fff; font-size: 22px; font-weight: 700; line-height: 1.3; }
    .login-body { padding: 32px 36px 36px; text-align: center; }
    .login-body p { color: var(--brand-navy); font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .btn-logout {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 24px; background: #f8f9fa; color: var(--brand-navy);
      border: 1.5px solid var(--brand-border); border-radius: 8px; font-size: 14px; font-weight: 600;
      text-decoration: none; transition: all 0.2s;
    }
    .btn-logout:hover { background: #e9ecef; border-color: #adb5bd; }
    .login-footer {
      text-align: center; font-size: 12px; color: var(--brand-muted);
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--brand-border);
    }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <div class="badge-brand">ERROR</div>
    <h1>Access Denied</h1>
  </div>
  <div class="login-body">
    <p>You do not currently have access to any systems. Please contact your administrator to be granted access.</p>
    
    <a href="{{ url_for('logout') }}" class="btn-logout"><i class="bi bi-box-arrow-left"></i> Sign Out</a>

    <div class="login-footer">Gateway SSO System &copy; ESSIC</div>
  </div>
</div>
</body>
</html>
